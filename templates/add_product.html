{% extends "base.html" %}
{% block title %}Add Product – FoodDB{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-plus-circle me-2 text-success"></i>Add Product</h2>

<div class="card shadow-sm" style="max-width:600px;">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Barcode <span class="text-danger">*</span></label>
        <div class="input-group">
          <input type="text" name="barcode" class="form-control font-monospace" required value="{{ form.get('barcode','') }}" placeholder="e.g. 5000112637922">
          <a href="{{ url_for('scan') }}" class="btn btn-outline-success" title="Scan barcode"><i class="bi bi-camera"></i></a>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" required value="{{ form.get('name','') }}" placeholder="e.g. Heinz Tomato Ketchup">
      </div>
      <div class="mb-3">
        <label class="form-label">Brand</label>
        <input type="text" name="brand" class="form-control" value="{{ form.get('brand','') }}" placeholder="e.g. Heinz">
      </div>
      <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" value="{{ form.get('category','') }}" placeholder="e.g. Condiments">
      </div>
      <div class="row">
        <div class="col mb-3">
          <label class="form-label">Calories (kcal)</label>
          <input type="number" name="calories" class="form-control" step="0.1" min="0" value="{{ form.get('calories','') }}">
        </div>
        <div class="col mb-3">
          <label class="form-label">Weight (g)</label>
          <input type="number" name="weight_g" class="form-control" step="0.1" min="0" value="{{ form.get('weight_g','') }}">
        </div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Save Product</button>
        <a href="{{ url_for('products') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
