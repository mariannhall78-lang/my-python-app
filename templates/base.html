<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FoodDB{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark bg-success px-3">
    <a class="navbar-brand fw-bold" href="{{ url_for('home') }}"><i class="bi bi-upc-scan me-2"></i>FoodDB</a>
    <div class="d-flex gap-3">
      <a class="nav-link text-white" href="{{ url_for('home') }}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
      <a class="nav-link text-white" href="{{ url_for('products') }}"><i class="bi bi-list-ul me-1"></i>Products</a>
      <a class="nav-link text-white" href="{{ url_for('add_product') }}"><i class="bi bi-plus-circle me-1"></i>Add</a>
      <a class="nav-link text-white" href="{{ url_for('scan') }}"><i class="bi bi-camera me-1"></i>Scan</a>
    </div>
  </nav>

  <div class="container-fluid py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
