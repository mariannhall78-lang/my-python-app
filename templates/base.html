<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FoodDB{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="app-shell">
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('home') }}">
        <span class="brand-mark"><i class="bi bi-upc-scan"></i></span>
        <span>FoodDB</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="mainNav">
        <div class="navbar-nav align-items-lg-center gap-lg-2">
          <a class="nav-link" href="{{ url_for('home') }}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
          <a class="nav-link" href="{{ url_for('products') }}"><i class="bi bi-grid me-1"></i>Browse Products</a>
          <a class="nav-link" href="{{ url_for('add_product') }}"><i class="bi bi-plus-circle me-1"></i>Add Product</a>
          <a class="nav-link" href="{{ url_for('scan') }}"><i class="bi bi-camera me-1"></i>Barcode Scanner</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-lg-4 py-4 py-lg-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
