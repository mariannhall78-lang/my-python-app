{% extends "base.html" %}
{% block title %}Scan Barcode – FoodDB{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-upc-scan me-2 text-success"></i>Barcode Scanner</h2>

<div class="row g-4">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header fw-semibold"><i class="bi bi-camera me-2"></i>Camera Scanner</div>
      <div class="card-body text-center">
        <video id="preview" class="w-100 rounded mb-3" style="max-height:300px;background:#000;" autoplay muted playsinline></video>
        <div id="cam-status" class="text-muted small mb-2">Click Start to activate camera</div>
        <div class="d-flex gap-2 justify-content-center">
          <button id="btn-start" class="btn btn-success"><i class="bi bi-play-fill me-1"></i>Start</button>
          <button id="btn-stop" class="btn btn-outline-secondary" disabled><i class="bi bi-stop-fill me-1"></i>Stop</button>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header fw-semibold"><i class="bi bi-keyboard me-2"></i>Manual Lookup</div>
      <div class="card-body">
        <label class="form-label">Enter barcode</label>
        <div class="input-group mb-3">
          <input id="manual-barcode" type="text" class="form-control font-monospace" placeholder="e.g. 5000112637922">
          <button id="btn-lookup" class="btn btn-success">Lookup</button>
        </div>
        <div id="result"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='scanner.js') }}"></script>
{% endblock %}
